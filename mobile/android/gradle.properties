# AndroidX migration
android.useAndroidX=true
android.enableJetifier=true
# Kotlin/Gradle compat
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g
org.gradle.daemon=true
org.gradle.parallel=true
android.builtInKotlin=false
android.newDsl=false
# Disable Kotlin incremental compilation — fixes cache-corruption stack traces
# when multiple Kotlin plugins (share_plus + printing) share daemon caches.
kotlin.incremental=false
kotlin.daemon.useFallbackStrategy=true
