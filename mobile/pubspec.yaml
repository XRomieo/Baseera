name: baseera
description: Baseera — Multi-source AI analyst for supply chain intelligence. AISeekho 2026 Hackathon.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP
  dio: ^5.7.0
  
  # State Management
  provider: ^6.1.2
  
  # UI Enhancements
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  
  # Icons
  cupertino_icons: ^1.0.8

  # File system
  path_provider: ^2.1.0

  # PDF generation + sharing
  pdf: ^3.10.8
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
