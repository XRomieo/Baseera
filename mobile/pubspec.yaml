name: baseera
description: Baseera — Multi-source AI analyst for supply chain intelligence. AISeekho 2026 Hackathon.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  dio: ^5.7.0

  # State Management
  provider: ^6.1.2

  # UI Enhancements
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1

  # Icons
  cupertino_icons: ^1.0.8
  lucide_icons_flutter: ^3.1.14

  # Env vars (cloud API URL for release builds)
  flutter_dotenv: ^5.1.0

  # File system
  path_provider: ^2.1.0

  # PDF generation + sharing
  pdf: ^3.10.8
  printing: ^5.14.3
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_native_splash:
  color: "#0A0A12"
  image: assets/icon/splash.png
  android_12:
    color: "#0A0A12"
    image: assets/icon/splash.png
    icon_background_color: "#0A0A12"
  android: true
  ios: false
  web: false
  fullscreen: false
  android_gravity: center
  android_screen_orientation: portrait

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/icon/
    - .env

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1A1035"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: false
